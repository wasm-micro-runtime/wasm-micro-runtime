# The west manifest file for WAMR on Zephyr smoke test.
#
manifest:
  #
  # Please add items below based on alphabetical order
  projects:
    # required by the samples that enable CONFIG_FILE_SYSTEM_LITTLEFS
    - name: littlefs
      url: https://github.com/zephyrproject-rtos/littlefs
      revision: 408c16a909dd6cf128874a76f21c793798c9e423
      path: modules/fs/littlefs

    - name: zephyr
      url: https://github.com/zephyrproject-rtos/zephyr
      revision: v3.7.0
      clone-depth: 1
      path: zephyr
      west-commands: scripts/west-commands.yml

  self:
    path: application
