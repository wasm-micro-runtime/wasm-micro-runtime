common:
  tags: wamr ztest threads interpreter pool
  harness: ztest
tests:
  wamr.zephyr.thread_pool.kernel_contract:
    platform_allow:
      - native_sim
      - qemu_arc/qemu_arc_hs
    extra_configs:
      - CONFIG_USERSPACE=n
  wamr.zephyr.thread_pool.user_contract:
    platform_allow:
      - qemu_arc/qemu_arc_hs
    extra_configs:
      - CONFIG_USERSPACE=y
      - CONFIG_WAMR_USERSPACE_PARTITION="wamr_partition"
      - CONFIG_WAMR_TEST_USER_MODE=y
      - CONFIG_DYNAMIC_OBJECTS=n
  wamr.zephyr.thread_pool.user_transition:
    platform_allow:
      - qemu_arc/qemu_arc_hs
    extra_configs:
      - CONFIG_USERSPACE=y
      - CONFIG_WAMR_USERSPACE_PARTITION="wamr_partition"
      - CONFIG_WAMR_TEST_USER_MODE=y
      - CONFIG_WAMR_TEST_THREAD_POOL_TRANSITION=y
      - CONFIG_DYNAMIC_OBJECTS=n
