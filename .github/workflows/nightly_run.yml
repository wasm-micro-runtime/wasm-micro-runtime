  addr2line_tests_multi_sdk:
    needs: nightly_guard
    if: ${{ !cancelled() && needs.nightly_guard.outputs.run == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      # wasi-sdk 29/33, wabt and binaryen are ~1GB of pinned releases that
      # never change; cache the extracted trees so the nightly does not
      # re-download and re-extract them every day. Bump the key when a
      # toolchain version changes.
      - name: Cache addr2line toolchains
        id: cache_toolchains
        uses: actions/cache@v6
        with:
          path: ./toolchains
          key: ${{ runner.os }}-addr2line-toolchains-wasi-sdk-29.0-wasi-sdk-33.0-wabt-1.0.34-binaryen-117

      - name: Install toolchains from cache
        if: steps.cache_toolchains.outputs.cache-hit == 'true'
        run: sudo cp -r ./toolchains/opt/* /opt/

      - name: Install wasi-sdk 29.0
        if: steps.cache_toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/opt/wasi-sdk-29.0-x86_64-linux
          curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz \
            | tar xz -C ./toolchains/opt/wasi-sdk-29.0-x86_64-linux --strip-components=1
          sudo cp -r ./toolchains/opt/wasi-sdk-29.0-x86_64-linux /opt/

      - name: Install wasi-sdk 33.0
        if: steps.cache_toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/opt/wasi-sdk-33.0-x86_64-linux
          curl -L https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz \
            | tar xz -C ./toolchains/opt/wasi-sdk-33.0-x86_64-linux --strip-components=1
          sudo cp -r ./toolchains/opt/wasi-sdk-33.0-x86_64-linux /opt/

      - name: Install wabt
        if: steps.cache_toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/opt/wabt
          curl -L https://github.com/WebAssembly/wabt/releases/download/1.0.34/wabt-1.0.34-ubuntu.tar.gz \
            | tar xz -C ./toolchains/opt/wabt --strip-components=1
          sudo cp -r ./toolchains/opt/wabt /opt/

      - name: Install binaryen
        if: steps.cache_toolchains.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./toolchains/opt/binaryen
          curl -L https://github.com/WebAssembly/binaryen/releases/download/version_117/binaryen-version_117-x86_64-linux.tar.gz \
            | tar xz -C ./toolchains/opt/binaryen --strip-components=1
          sudo cp -r ./toolchains/opt/binaryen /opt/

      - name: Install pytest
        run: pip install pytest

      - name: Run addr2line.py tests across both SDKs
        working-directory: test-tools/addr2line/tests
        run: ./run_tests.sh --multi-sdk -v

  test:
    needs: build_llvm_libraries_on_ubuntu
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit combination list (include-only matrix). Sanitizer variants
        # cannot be expressed as partial include entries: per GitHub's matrix
        # semantics, an `include` entry that matches an existing combination
        # overwrites previously *included* values (only the original
        # cartesian values are protected), so two sanitizers on the same
        # (running_mode, test_option) slot would collapse into one. Every
        # combination is therefore declared in full.
        #
        # Coverage rationale:
        # - DEFAULT (plain spec suite) keeps the exact sanitizer coverage the
        #   old 6 modes x 4 sanitizers x 6 options cross product had on the
        #   DEFAULT option: asan/tsan/ubsan only on the engines that support
        #   them (asan aot, tsan aot+fast-interp, ubsan everywhere except
        #   fast-interp). That is 14 of the previous 84 jobs.
        # - The five feature-flag spec variants (-M/-S/-N/-p/-w) previously
        #   ran on every engine x sanitizer; now they run on a representative
        #   interp engine (classic-interp) plus the flagship engine (aot),
        #   with jit/fast-interp kept for SIMD where the feature is only
        #   meaningful there, and sanitizer coverage on aot only. The
        #   per-engine baseline is already covered by DEFAULT.
        include:
          # ---- DEFAULT: plain spec suite on every engine -----------------
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "classic-interp"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "classic-interp"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ubsan
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "fast-interp"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "fast-interp"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: tsan
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "jit"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "jit"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ubsan
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "fast-jit"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "fast-jit"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ubsan
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ubsan
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: tsan
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: asan
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "multi-tier-jit"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "multi-tier-jit"
            test_option: $DEFAULT_TEST_OPTIONS
            sanitizer: ubsan

          # ---- MULTI_MODULES: interp + aot (see build_iwasm excludes) -----
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "classic-interp"
            test_option: $MULTI_MODULES_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $MULTI_MODULES_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $MULTI_MODULES_TEST_OPTIONS
            sanitizer: ubsan

          # ---- SIMD: fast-interp/jit/aot (build_iwasm forces SIMD=0 on
          # classic-interp, fast-jit and multi-tier-jit) --------------------
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "fast-interp"
            test_option: $SIMD_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "jit"
            test_option: $SIMD_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $SIMD_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $SIMD_TEST_OPTIONS
            sanitizer: ubsan

          # ---- EXTENDED_CONST_EXPR: representative interp + aot -----------
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "classic-interp"
            test_option: $EXTENDED_CONST_EXPR_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $EXTENDED_CONST_EXPR_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $EXTENDED_CONST_EXPR_TEST_OPTIONS
            sanitizer: ubsan

          # ---- THREADS: interp + aot; tsan on aot keeps race detection ----
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "classic-interp"
            test_option: $THREADS_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $THREADS_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $THREADS_TEST_OPTIONS
            sanitizer: ubsan
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $THREADS_TEST_OPTIONS
            sanitizer: tsan

          # ---- WASI certification: interp + aot; tsan on aot ---------------
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "classic-interp"
            test_option: $WASI_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $WASI_TEST_OPTIONS
            sanitizer: ""
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $WASI_TEST_OPTIONS
            sanitizer: ubsan
          - os: ubuntu-22.04
            ubuntu_version: "22.04"
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_ubuntu.outputs.cache_key }}
            running_mode: "aot"
            test_option: $WASI_TEST_OPTIONS
            sanitizer: tsan
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      - name: install-wasi-sdk-wabt
        if: matrix.test_option == '$WASI_TEST_OPTIONS'
        uses: ./.github/actions/install-wasi-sdk-wabt
        with:
          os: ${{ matrix.os }}

      - name: set env variable(if llvm are used)
        if: matrix.running_mode == 'aot' || matrix.running_mode == 'jit' || matrix.running_mode == 'multi-tier-jit'
        run: echo "USE_LLVM=true" >> $GITHUB_ENV

      - name: set env variable(if x86_32 test needed)
        if: >
          (matrix.test_option == '$DEFAULT_TEST_OPTIONS' || matrix.test_option == '$THREADS_TEST_OPTIONS'
           || matrix.test_option == '$WASI_TEST_OPTIONS')
          && matrix.running_mode != 'fast-jit' && matrix.running_mode != 'jit' && matrix.running_mode != 'multi-tier-jit'
        run: echo "TEST_ON_X86_32=true" >> $GITHUB_ENV

      - name: set additional tsan options
        run: |
          echo "TSAN_OPTIONS=suppressions=$PWD/tsan_suppressions.txt" >> $GITHUB_ENV
          sudo sysctl vm.mmap_rnd_bits=28
        working-directory: tests/wamr-test-suites

      #only download llvm libraries in jit and aot mode
      - name: Get LLVM libraries
        if: env.USE_LLVM == 'true'
        id: retrieve_llvm_libs
        uses: actions/cache@v6
        with:
          path: |
            ./core/deps/llvm/build/bin
            ./core/deps/llvm/build/include
            ./core/deps/llvm/build/lib
            ./core/deps/llvm/build/libexec
            ./core/deps/llvm/build/share
          key: ${{ matrix.llvm_cache_key }}

      - name: Quit if cache miss
        if: env.USE_LLVM == 'true' && steps.retrieve_llvm_libs.outputs.cache-hit != 'true'
        run: echo "::error::can not get prebuilt llvm libraries" && exit 1

      - name: install jq JSON processor
        if: matrix.running_mode == 'aot' && matrix.test_option == '$WASI_TEST_OPTIONS'
        run: sudo apt-get update && sudo apt install -y jq

      - name: install for wabt compilation
        run: sudo apt update && sudo apt install -y ninja-build

      - name: Build WASI thread tests
        if: matrix.test_option == '$WASI_TEST_OPTIONS'
        run: bash build.sh
        working-directory: ./core/iwasm/libraries/lib-wasi-threads/test/

      - name: Build WASI thread stress tests
        if: matrix.test_option == '$WASI_TEST_OPTIONS'
        run: bash build.sh
        working-directory: ./core/iwasm/libraries/lib-wasi-threads/stress-test/

      - name: build socket api tests
        if: matrix.test_option == '$WASI_TEST_OPTIONS'
        run: bash build.sh
        working-directory: ./core/iwasm/libraries/lib-socket/test/

      - name: run tests
        timeout-minutes: 40
        run: ./test_wamr.sh ${{ matrix.test_option }} -t ${{ matrix.running_mode }} -T "${{ matrix.sanitizer }}"
        working-directory: ./tests/wamr-test-suites

      #only install x32 support libraries when to run x86_32 cases
      - name: install x32 support libraries
        if: env.TEST_ON_X86_32 == 'true'
        run:
          # Add another apt repository as some packages cannot
          # be downloaded with the github default repository
          sudo curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc &&
          sudo apt-add-repository https://packages.microsoft.com/ubuntu/${{ matrix.ubuntu_version }}/prod &&
          sudo apt-get update &&
          sudo apt install -y g++-multilib lib32gcc-9-dev

      - name: run tests x86_32
        timeout-minutes: 40
        if: env.TEST_ON_X86_32 == 'true'
        run: ./test_wamr.sh ${{ env.X86_32_TARGET_TEST_OPTIONS }} ${{ matrix.test_option }} -t ${{ matrix.running_mode }}
        working-directory: ./tests/wamr-test-suites

  report_failure:
    needs:
      - nightly_guard
      - build_llvm_libraries_on_ubuntu
      - build_wamrc
      - build_iwasm
      - build_unit_tests
      - build_iwasm_linux_gcc4_8
      - build_samples_wasm_c_api
      - build_samples_others
      - addr2line_tests_multi_sdk
      - test
    if: ${{ always() && github.event_name == 'schedule' && needs.nightly_guard.outputs.run == 'true' && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create a nightly failure issue if needed
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: nightly_run scheduled failure
        run: |
          open_issues=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --search "$ISSUE_TITLE in:title" --json title \
            --jq '[.[] | select(.title == env.ISSUE_TITLE)] | length')
          if [ "$open_issues" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body "Scheduled nightly run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
