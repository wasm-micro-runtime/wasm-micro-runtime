name: compilation on windows-2022

on:
  # Fork CI: runs on the fork's own Actions minutes when a contributor
  # pushes a branch to their fork.
  push:
    # Upstream pushes never reach the jobs anyway (the gate job returns
    # run=false unless the repository is a fork), so this filter only trims a
    # fork's mirrored copies of the maintainer branches - re-pushing main,
    # release/** or dev/** to a fork is a sync, not work worth building.
    # NOTE: do not name a fork feature branch main, release/*, or dev/* -
    # its push CI would be silently skipped by this filter.
    branches-ignore:
      - "main"
      - "release/**"
      - "dev/**"
  # Upstream CI: only spend upstream minutes once a PR is approved
  # (first approval only, enforced by the gate job below).
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
  # allow to be triggered manually
  workflow_dispatch:

env:
  # Merge ref to check out on approval-gated review events; empty elsewhere
  # so checkout falls back to the event's default ref.
  PR_REF: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
  # For Spec Test
  DEFAULT_TEST_OPTIONS: "-s spec -b"
  MULTI_MODULES_TEST_OPTIONS: "-s spec -b -M"
  THREADS_TEST_OPTIONS: "-s spec -b -p"
  WASI_TEST_OPTIONS: "-s wasi_certification -w"
  WASI_TEST_FILTER: ${{ github.workspace }}/product-mini/platforms/windows/wasi_filtered_tests.json
  # Used when building the WASI socket and thread tests
  CC: ${{ github.workspace }}/wasi-sdk/bin/clang

# Cancel any in-flight jobs for the same PR/branch so there's only one active
# at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate upstream minutes: always runs (a few-second no-op) and outputs `run`,
  # "true" only for a fork push or a PR's first approval. It must NOT be
  # skipped: a skipped job propagates the skip down the needs chain to every
  # descendant, even ones that broke the chain with their own `if`.
  gate:
    name: approval gate
    permissions:
      # `actions: read`: the gate dedups per head SHA by listing this
      # workflow's own runs.
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gate.yml
    with:
      paths: |
        .github/actions/**
        .github/scripts/**
        .github/workflows/build_llvm_libraries.yml
        .github/workflows/compilation_on_windows.yml
        .github/workflows/gate.yml
        build-scripts/**
        core/**
        !core/deps/**
        product-mini/platforms/common/**
        product-mini/platforms/windows/**
        samples/**
        !samples/workload/**
        tests/standalone/test-invoke-native/**
        tests/wamr-test-suites/**
        wamr-compiler/**
  build_llvm_libraries_on_windows:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build_llvm_libraries.yml
    with:
      os: "windows-2022"
      arch: "AArch64 ARM Mips RISCV X86"
      pr_ref: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

  build_iwasm:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: windows-2022
    strategy:
      matrix:
        build_options:
          [
            "-DWAMR_BUILD_AOT=1 -DWAMR_BUILD_INTERP=0",
            "-DWAMR_BUILD_AOT=0",
            "-DWAMR_BUILD_TAIL_CALL=1",
            "-DWAMR_BUILD_CUSTOM_NAME_SECTION=1",
            "-DWAMR_DISABLE_HW_BOUND_CHECK=1",
            "-DWAMR_BUILD_REF_TYPES=1",
            "-DWAMR_BUILD_DEBUG_INTERP=1",
            "-DWAMR_BUILD_LIB_PTHREAD=1",
            "-DWAMR_BUILD_LIB_WASI_THREADS=1",
            "-DWAMR_BUILD_LIBC_UVWASI=0 -DWAMR_BUILD_LIBC_WASI=1",
          ]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      - name: clone uvwasi library
        if: ${{ !contains(matrix.build_options, '-DWAMR_BUILD_LIBC_UVWASI=0') }}
        run: |
          cd core/deps
          git clone https://github.com/nodejs/uvwasi.git
      - name: Build iwasm
        run: |
          cd product-mini/platforms/windows
          mkdir build && cd build
          cmake .. ${{ matrix.build_options }}
          cmake --build . --config Release --parallel 4

  test_invoke_native_msvc:
    name: invoke native (MSVC, ${{ matrix.arch }})
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      # The workflow-level CC is reserved for WASI tests. Leave native
      # compiler selection to the initialized MSVC environment.
      CC: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            vc_arch: x64
            target: X86_64
            simd_modes: "0 1"
          - os: windows-2022
            arch: Win32
            vc_arch: x86
            target: X86_32
            simd_modes: "0"
          - os: windows-11-arm
            arch: ARM64
            vc_arch: arm64
            target: AARCH64
            simd_modes: "0 1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.vc_arch }}

      - name: Build and run native invocation test
        shell: pwsh
        run: |
          foreach ($simd in "${{ matrix.simd_modes }}".Split(" ")) {
            $buildDir = "build-invoke-native-simd-$simd"
            cmake -S tests/standalone/test-invoke-native -B $buildDir `
              -G "NMake Makefiles" `
              -DWAMR_BUILD_TARGET=${{ matrix.target }} `
              -DWAMR_BUILD_AOT=0 `
              -DWAMR_BUILD_FAST_INTERP=1 `
              "-DWAMR_BUILD_SIMD=${simd}" `
              -DWAMR_BUILD_LIBC_WASI=0 `
              -DWAMR_DISABLE_HW_BOUND_CHECK=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Select-String -Path "$buildDir/CMakeCache.txt" -Pattern "^WAMR_BUILD_SIMD:[^=]+=$simd$" -Quiet)) {
              throw "CMake did not configure WAMR_BUILD_SIMD=$simd"
            }
            cmake --build $buildDir --config Release --parallel 4
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & ".\$buildDir\test_invoke_native.exe"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build native ARM64 iwasm without an explicit target
        if: matrix.target == 'AARCH64'
        shell: pwsh
        run: |
          cmake -S product-mini/platforms/windows -B build-iwasm-native `
            -G "NMake Makefiles" `
            -DWAMR_BUILD_AOT=0 `
            -DWAMR_BUILD_FAST_INTERP=1 `
            -DWAMR_BUILD_SIMD=0 `
            -DWAMR_BUILD_LIBC_WASI=0 `
            -DWAMR_DISABLE_HW_BOUND_CHECK=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-iwasm-native --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build-iwasm-native\iwasm.exe --version

  test_invoke_native_mingw:
    name: invoke native (MinGW, ${{ matrix.arch }})
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      # The workflow-level CC is reserved for WASI tests. Let the selected
      # MSYS2 environment provide its native compiler.
      CC: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            msystem: MINGW64
            target: X86_64
            simd_modes: "0 1"
          - os: windows-2022
            arch: x86
            msystem: MINGW32
            target: X86_32
            simd_modes: "0"
          - os: windows-11-arm
            arch: ARM64
            msystem: CLANGARM64
            target: AARCH64
            simd_modes: "0 1"
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      - name: Build and run native invocation test
        shell: msys2 {0}
        run: |
          set -euo pipefail
          for simd in ${{ matrix.simd_modes }}; do
            build_dir="build-invoke-native-simd-${simd}"
            cmake -S tests/standalone/test-invoke-native -B "${build_dir}" \
              -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DWAMR_BUILD_TARGET=${{ matrix.target }} \
              -DWAMR_BUILD_AOT=0 \
              -DWAMR_BUILD_FAST_INTERP=1 \
              -DWAMR_BUILD_SIMD="${simd}" \
              -DWAMR_BUILD_LIBC_WASI=0 \
              -DWAMR_DISABLE_HW_BOUND_CHECK=1
            grep -Eq "^WAMR_BUILD_SIMD:[^=]+=${simd}$" "${build_dir}/CMakeCache.txt"
            cmake --build "${build_dir}" --parallel 4
            "./${build_dir}/test_invoke_native.exe"
          done

      - name: Build native ARM64 iwasm without an explicit target
        if: matrix.target == 'AARCH64'
        shell: msys2 {0}
        run: |
          cmake -S product-mini/platforms/windows -B build-iwasm-native \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DWAMR_BUILD_AOT=0 \
            -DWAMR_BUILD_FAST_INTERP=1 \
            -DWAMR_BUILD_SIMD=0 \
            -DWAMR_BUILD_LIBC_WASI=0 \
            -DWAMR_DISABLE_HW_BOUND_CHECK=1
          cmake --build build-iwasm-native --parallel 4
          ./build-iwasm-native/iwasm.exe --version

  build_wamrc:
    needs: [build_llvm_libraries_on_windows]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-2022
            llvm_cache_key: ${{ needs.build_llvm_libraries_on_windows.outputs.cache_key }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      # since jobs.id can't contain the dot character
      # it is hard to use `format` to assemble the cache key
      - name: Get LLVM libraries
        id: retrieve_llvm_libs
        uses: actions/cache@v6
        with:
          path: |
            ./core/deps/llvm/build/bin
            ./core/deps/llvm/build/include
            ./core/deps/llvm/build/lib
            ./core/deps/llvm/build/libexec
            ./core/deps/llvm/build/share
          key: ${{ matrix.llvm_cache_key }}

      - name: Quit if cache miss
        if: steps.retrieve_llvm_libs.outputs.cache-hit != 'true'
        run: echo "::error::can not get prebuilt llvm libraries" && exit 1

      - name: Build wamrc
        run: |
          cmake -S . -B build
          cmake --build build --config Release --parallel 4
        working-directory: wamr-compiler

  test:
    runs-on: windows-2022
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        running_mode: ["classic-interp", "fast-interp"]
        test_option:
          [
            $DEFAULT_TEST_OPTIONS,
            $MULTI_MODULES_TEST_OPTIONS,
            $THREADS_TEST_OPTIONS,
            $WASI_TEST_OPTIONS,
          ]
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      - name: download and install wasi-sdk
        if: matrix.test_option == '$WASI_TEST_OPTIONS'
        run: |
          curl "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sdk-20.0.m-mingw.tar.gz" -o wasi-sdk.tar.gz -L
          mkdir wasi-sdk
          tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components 1

      - name: build socket api tests
        shell: bash
        if: matrix.test_option == '$WASI_TEST_OPTIONS'
        run: ./build.sh
        working-directory: ./core/iwasm/libraries/lib-socket/test/

      - name: Build WASI thread tests
        shell: bash
        if: matrix.test_option == '$WASI_TEST_OPTIONS'
        run: ./build.sh
        working-directory: ./core/iwasm/libraries/lib-wasi-threads/test/

      - name: run tests
        shell: bash
        timeout-minutes: 20
        run: ./test_wamr.sh ${{ matrix.test_option }} -t ${{ matrix.running_mode }}
        working-directory: ./tests/wamr-test-suites

  # Single stable check for branch protection. Set THIS as the required status
  # check, never an individual job: matrix job names are built from the matrix
  # dimensions, so every matrix refactor renames all of them and silently
  # invalidates whatever was configured under Settings -> Branches.
  #
  # `if: always()` is mandatory. Without it this job is skipped whenever an
  # upstream job fails, and a skipped job counts as passing for a required
  # check - it would be a gate that is green forever.
  #
  # `skipped` must count as success: when the gate resolves to run=false, every
  # job below is skipped, and that is the normal path.
  required:
    name: >-
      ${{ needs.gate.outputs.state == 'push' && 'windows CI on push'
      || needs.gate.outputs.state == 'awaiting' && 'windows CI awaiting approval'
      || needs.gate.outputs.state == 'approved' && 'windows CI approved'
      || 'windows CI' }}
    # `always()` keeps this aggregation check running even when upstream jobs
    # fail or are skipped, so GitHub evaluates the dynamic check name and the
    # script below can decide whether the workflow should pass.
    if: always()
    needs:
      [
        gate,
        build_llvm_libraries_on_windows,
        build_iwasm,
        test_invoke_native_msvc,
        test_invoke_native_mingw,
        build_wamrc,
        test,
      ]
    runs-on: ubuntu-22.04
    steps:
      - name: Report which dependency failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed_jobs=$(echo "$NEEDS" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' \
            | paste -sd ', ' -)
          if [ -n "$failed_jobs" ]; then
            echo "::error title=windows CI::failed or cancelled dependency jobs: $failed_jobs"
          fi
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            > /dev/null
