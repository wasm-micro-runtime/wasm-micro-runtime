name: Coding Guidelines

on:
  # Fork CI: runs on the fork's own Actions minutes when a contributor
  # pushes a branch to their fork.
  push:
    # Upstream pushes never reach the jobs anyway (the gate job returns
    # run=false unless the repository is a fork), so this filter only trims a
    # fork's mirrored copies of the maintainer branches - re-pushing main,
    # release/** or dev/** to a fork is a sync, not work worth building.
    # NOTE: do not name a fork feature branch main, release/*, or dev/* -
    # its push CI would be silently skipped by this filter.
    branches-ignore:
      - "main"
      - "release/**"
      - "dev/**"
  # Upstream CI: only do a full run once a PR is approved
  # (first approval only, enforced by the gate job below).
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
  # allow to be triggered manually
  workflow_dispatch:

# Cancel any in-flight jobs for the same PR/branch so there's only one active
# at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Merge ref to check out on approval-gated review events; empty elsewhere
  # so checkout falls back to the event's default ref.
  PR_REF: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

jobs:
  # Full-run gate: always runs (a few-second no-op) and outputs `run`,
  # "true" only for a fork push or a PR's first approval. It must NOT be
  # skipped: a skipped job propagates the skip down the needs chain to every
  # descendant, even ones that broke the chain with their own `if`.
  gate:
    name: approval gate
    permissions:
      # `checks: read`: the gate reads the head commit's check runs to see
      # whether it already has a verdict.
      checks: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gate.yml
    with:
      check_name: coding guidelines

  changes:
    name: changed lint targets
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.targets.outputs.base }}
      hadolint: ${{ steps.targets.outputs.hadolint }}
      hadolint_files: ${{ steps.targets.outputs.hadolint_files }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_REF }}
          fetch-depth: 0

      - id: targets
        name: Find changed lint targets
        shell: bash
        run: |
          # pull_request_review: base.sha is the PR base commit.
          # push: github.event.before is the previous tip. It can be absent
          # after a force-push rewrites history, so fall back to main's
          # merge-base for it, a branch's first push, and workflow_dispatch.
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            before="${{ github.event.before }}"
            if [ -z "$before" ] \
              || [ "$before" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git fetch --quiet origin main
              base=$(git merge-base origin/main HEAD)
            else
              base="$before"
            fi
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"

          changed_files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD)
          hadolint_files=$(printf '%s\n' "$changed_files" \
            | grep -E '(^|/)Dockerfile[^/]*$' || true)

          if [ -n "$hadolint_files" ]; then
            echo "hadolint=true" >> "$GITHUB_OUTPUT"
          else
            echo "hadolint=false" >> "$GITHUB_OUTPUT"
          fi
          jq -Rsc 'split("\n") | map(select(length > 0))' <<< "$hadolint_files" \
            | { read -r files; echo "hadolint_files=$files" >> "$GITHUB_OUTPUT"; }

  compliance_job:
    name: format, naming & license headers
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_REF }}
          fetch-depth: 0

      - name: install clang-format-21
        run: |
          # clang-format 21 matches the LLVM shipped in Xcode 26/27, so
          # contributors who build or auto-format on macOS/Xcode get the same
          # result as CI and other LLVM-built platforms - no formatting
          # surprises. It is a small (~50 MB) apt package from apt.llvm.org,
          # not a full LLVM toolchain download.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-format-21
          clang-format-21 --version

      # github.event.pull_request.base.label = ${{github.repository}}/${{github.base_ref}}
      - name: Run Coding Guidelines Checks
        run: |
          # pull_request_review: base.sha is the PR base commit.
          # push: github.event.before can be the zero SHA or a removed commit
          # after a history rewrite. Fall back to the merge-base with origin/main.
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            before="${{ github.event.before }}"
            if [ -z "$before" ] \
              || [ "$before" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git fetch --quiet origin main
              base=$(git merge-base origin/main HEAD)
            else
              base="$before"
            fi
          fi
          /usr/bin/env python3 ./ci/coding_guidelines_check.py --commits "$base..HEAD"

  # Same LLVM libraries job as the compilation workflow, so both restore the
  # same cache entry rather than building LLVM twice.
  build_llvm_libraries_on_ubuntu_2204:
    name: llvm libraries (ubuntu-22.04, X86)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build_llvm_libraries.yml
    with:
      os: "ubuntu-22.04"
      arch: "X86"
      pr_ref: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

  clang_tidy:
    # Advisory.  The job runs and reports its findings as this check and as
    # annotations, and `required` below does not depend on it.
    name: clang-tidy
    needs: [changes, build_llvm_libraries_on_ubuntu_2204]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.build_llvm_libraries_on_ubuntu_2204.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}
          fetch-depth: 0

      - name: install clang-21 and clang-tidy-21
        run: |
          # Same LLVM 21 as clang-format above, and for the same reason: the
          # check has to give every contributor the same answer. clang itself
          # is needed as well as clang-tidy -- the compile databases are
          # configured with it, see build-scripts/clang_toolchain.cmake.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          . /etc/os-release
          echo "deb http://apt.llvm.org/${VERSION_CODENAME}/ llvm-toolchain-${VERSION_CODENAME}-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-21 clang-tidy-21 libzstd-dev zlib1g-dev
          sudo ln -sf /usr/bin/clang-21 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/bin/clang++
          clang-tidy-21 --version

      # every preset is required, and all-on-llvm-jit finds LLVM under
      # core/deps/llvm/build, so the check restores the same libraries the
      # compilation jobs use.
      - name: Get LLVM libraries
        id: retrieve_llvm_libs
        uses: actions/cache@v6
        with:
          path: |
            ./core/deps/llvm/build/bin
            ./core/deps/llvm/build/include
            ./core/deps/llvm/build/lib
            ./core/deps/llvm/build/libexec
            ./core/deps/llvm/build/share
          key: ${{ needs.build_llvm_libraries_on_ubuntu_2204.outputs.cache_key }}

      - name: Quit if cache miss
        if: steps.retrieve_llvm_libs.outputs.cache-hit != 'true'
        run: echo "::error::can not get prebuilt llvm libraries" && exit 1

      - name: Run clang-tidy on the changed lines
        # The check configures every samples/minimum preset so it can say which
        # feature flag vectors actually compile each changed line, and scans
        # with the ones that do.  Every preset is required: the vectors only
        # cover the feature macros together, so a preset that cannot configure
        # fails the check instead of quietly dropping its configuration.
        #
        # The verdict and the tail of the run go to the step summary, so the
        # result of this advisory check is readable without opening the log;
        # the whole output stays in the log below.
        run: |
          set +e
          /usr/bin/env python3 ./ci/clang_tidy_diff_check.py \
            --commits "${{ needs.changes.outputs.base }}..HEAD" 2>&1 \
            | tee clang-tidy.log
          status=${PIPESTATUS[0]}

          # 0 success, 1 errors found, 2 partial scan, 3 run failed. The check
          # prints which lines were not scanned, so a 2 is a report, not a pass
          # to be quietly swallowed.
          case $status in
            0) verdict="success: no errors, nothing that should be scanned was left out" ;;
            1) verdict="errors found, see the log" ;;
            2) verdict="partial scan: part or all of the change that should be scanned was not" ;;
            3) verdict="run failed, see the log" ;;
            *) verdict="did not run to completion" ;;
          esac

          {
            echo "### clang-tidy: exit $status -- $verdict"
            echo
            echo "<details><summary>tail of the run</summary>"
            echo
            echo '```'
            tail -n 200 clang-tidy.log
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=clang-tidy::exit $status -- $verdict"
          if [ $status -eq 2 ]; then
            exit 0
          fi
          exit $status

  actionlint:
    name: actionlint
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          version: 1.7.12
          shellcheck: false
          pyflakes: false

  hadolint:
    name: hadolint
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.hadolint == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJSON(needs.changes.outputs.hadolint_files) }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      - name: hadolint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  # Single stable check for branch protection. Configure this job, rather than
  # individual lint jobs, as the required status check in the repository ruleset.
  #
  # clang_tidy is deliberately not one of the dependencies: it runs and reports
  # its findings as its own check with its own annotations, but its verdict is
  # advice to the author, not a merge gate.
  required:
    name: ${{ needs.gate.outputs.check_name || 'coding guidelines interrupted' }}
    # `always()` keeps this aggregation check running even when upstream jobs
    # fail or are skipped, so GitHub evaluates the dynamic check name and the
    # script below can decide whether the workflow should pass.
    if: always()
    needs: [gate, changes, compliance_job, actionlint, hadolint]
    runs-on: ubuntu-24.04
    steps:
      # state=concluded republishes the verdict that still stands on this head
      # commit. A green is published by the steps below; a red has to be
      # published the same way it was earned - by failing.
      - name: Replay the standing verdict
        if: ${{ needs.gate.outputs.state == 'concluded' && needs.gate.outputs.verdict == 'failure' }}
        run: |
          echo "::error title=coding guidelines::replaying the failure that still stands on this head commit"
          exit 1
      - name: Report which dependency failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed_jobs=$(echo "$NEEDS" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' \
            | paste -sd ', ' -)
          if [ -n "$failed_jobs" ]; then
            echo "::error title=coding guidelines::failed or cancelled dependency jobs: $failed_jobs"
          fi
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            > /dev/null
