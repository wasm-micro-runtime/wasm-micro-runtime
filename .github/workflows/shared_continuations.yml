name: Shared C continuations
on:
  workflow_dispatch:
  pull_request:
    paths: ["core/**", "build-scripts/**", "samples/shared-continuations/**", ".github/workflows/shared_continuations.yml"]
permissions:
  contents: read
jobs:
  c-fixture:
    name: C fixture and ASan (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      WASM_EXT_TEST_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - if: runner.os != 'Windows'
        run: |
          python3 samples/shared-continuations/run.py --runtime wamr --root . --build build/shared-c-fixture --feature on
          python3 samples/shared-continuations/run.py --runtime wamr --root . --build build/shared-c-features --gc --simd --aot
          python3 samples/shared-continuations/run.py --runtime wamr --root . --build build/shared-c-asan --gc --aot --call-stacks --sanitize
      - name: Windows x64 release and runtime/client ASan
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=amd64
          python samples/shared-continuations/run.py --runtime wamr --root . --build build/shared-c-fixture --feature on
          if errorlevel 1 exit /b 1
          python samples/shared-continuations/run.py --runtime wamr --root . --build build/shared-c-asan --gc --aot --call-stacks --sanitize

  native-unwind:
    name: Native unwind (GDB, C/C++/Rust)
    runs-on: ubuntu-24.04
    env:
      WASM_EXT_TEST_ONLY: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y gdb
      - run: python3 samples/shared-continuations/run.py --runtime wamr --root . --build build/native-unwind --call-stacks
      - run: python3 samples/shared-continuations/debug/run.py --runtime wamr --include build/native-unwind/include --library build/native-unwind/runtime/libiwasm.a --build build/native-unwind/client --debugger gdb
