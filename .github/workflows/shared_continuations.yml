name: Shared C continuations
on:
  workflow_dispatch:
  pull_request:
    paths: ["core/**", "build-scripts/**", "samples/shared-continuations/**", ".github/workflows/shared_continuations.yml"]
jobs:
  c-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 samples/shared-continuations/run.py --runtime wamr --root . --build build/shared-c-fixture --feature on
