# Reusable gate shared by every upstream CI workflow. Callers invoke it via
# `uses:` and gate their real jobs on `needs.gate.outputs.run`. Per event:
#   - push: runs only on a fork, so upstream never does a full run on a plain
#     push; upstream push workflows still run the no-op gate to report status.
#   - pull_request_review (submitted) and pull_request (synchronize): each
#     event rechecks the PR's current approval state; the submitted review state
#     alone is not authoritative (a comment can leave an approval intact). An
#     approved PR runs CI once per head commit. A new head commit - a push, a
#     rebase, "Update branch" - is a new version and runs again; the same head
#     commit whose verdict still stands does not. A head commit that has no
#     verdict left, because the run was interrupted or because a dismissal
#     emptied it, runs again, so any later event heals a CI that never
#     finished. A code-changing push is dismissed by GitHub itself, so it waits
#     for a fresh approval instead of doing a full run.
#   - anything else (e.g. workflow_dispatch, schedule): always runs.
#
# The decision lives in .github/scripts/ci_gate_decision.py; this file only
# wires the event and the caller's inputs into it and publishes what it
# decided. The check name the aggregation job must use is computed there as
# well, so "which states may publish the required name" is implemented once.
name: gate

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Optional newline-separated path globs. When set, the approval gate
          fires only if the PR touches these paths, instead of the caller's
          own on.push.paths. Use it to run heavy pipelines on approval only
          when their own definition changed.
        type: string
        required: false
        default: ""
      check_name:
        description: >-
          This pipeline's canonical check name, for example "ubuntu CI": the
          name its aggregation job publishes and the name the gate reads to
          find the head commit's existing verdict. Leave it empty for a
          pipeline without an aggregation job - it then has no verdict to
          reuse and runs whenever the other two questions allow.
        type: string
        required: false
        default: ""
    outputs:
      run:
        description: '"true" if downstream jobs should run, else "false".'
        value: ${{ jobs.gate.outputs.run }}
      state:
        description: 'Gate state, for the run log: run, skipped, push, awaiting, concluded.'
        value: ${{ jobs.gate.outputs.state }}
      check_name:
        description: 'Check name the aggregation job must publish, canonical name or alias.'
        value: ${{ jobs.gate.outputs.check_name }}
      verdict:
        description: >-
          Only for state=concluded: the verdict the aggregation job has to
          publish again (success or failure). A failure means the job must fail
          on purpose, so a red stays red.
        value: ${{ jobs.gate.outputs.verdict }}

permissions:
  # `checks: read` reads the head commit's check runs and their check suites,
  # which is how the gate answers "does this head commit have a verdict?".
  checks: read
  contents: read
  pull-requests: read

jobs:
  gate:
    runs-on: ubuntu-22.04
    outputs:
      run: ${{ steps.g.outputs.run }}
      state: ${{ steps.g.outputs.state }}
      check_name: ${{ steps.g.outputs.check_name }}
      verdict: ${{ steps.g.outputs.verdict }}
    steps:
      # A local composite action needs the repo checked out before it can be
      # referenced; fetch just .github (also carries the gate and path-filter
      # scripts).
      - name: checkout workflow metadata
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false
      - id: g
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The caller's inputs, read by the decision script.
          GATE_PATHS: ${{ inputs.paths }}
          GATE_CHECK_NAME: ${{ inputs.check_name }}
          # The caller's workflow ref: the path filter falls back to its
          # on.push.paths when the caller passes no explicit `paths`.
          GATE_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -eo pipefail
          # The path filter parses the caller's workflow, which needs pyyaml.
          python3 -c 'import yaml' 2>/dev/null \
            || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          # The decision reads GATE_* and the runner's own GITHUB_EVENT_*,
          # GITHUB_RUN_ATTEMPT and GITHUB_REPOSITORY, and appends
          # run/state/check_name/verdict to $GITHUB_OUTPUT itself.
          python3 .github/scripts/ci_gate_decision.py
