name: compilation on SGX

on:
  # Fork CI: runs on the fork's own Actions minutes when a contributor
  # pushes a branch to their fork.
  push:
    # Upstream pushes never reach the jobs anyway (the gate job returns
    # run=false unless the repository is a fork), so this filter only trims a
    # fork's mirrored copies of the maintainer branches - re-pushing main,
    # release/** or dev/** to a fork is a sync, not work worth building.
    # NOTE: do not name a fork feature branch main, release/*, or dev/* -
    # its push CI would be silently skipped by this filter.
    branches-ignore:
      - "main"
      - "release/**"
      - "dev/**"
  # Upstream CI: only spend upstream minutes once a PR is approved
  # (first approval only, enforced by the gate job below).
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
  # allow to be triggered manually
  workflow_dispatch:

# Cancel any in-flight jobs for the same PR/branch so there's only one active
# at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Merge ref to check out on approval-gated review events; empty elsewhere
  # so checkout falls back to the event's default ref.
  PR_REF: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
  # ref types enabled in wamrc by default, so we need to enable it for iwasm in AOT mode
  AOT_BUILD_OPTIONS: "-DWAMR_BUILD_AOT=1 -DWAMR_BUILD_FAST_INTERP=0 -DWAMR_BUILD_INTERP=0 -DWAMR_BUILD_JIT=0 -DWAMR_BUILD_LAZY_JIT=0 -DWAMR_BUILD_REF_TYPES=1"
  CLASSIC_INTERP_BUILD_OPTIONS: "-DWAMR_BUILD_AOT=0 -DWAMR_BUILD_FAST_INTERP=0 -DWAMR_BUILD_INTERP=1 -DWAMR_BUILD_JIT=0 -DWAMR_BUILD_LAZY_JIT=0"
  FAST_INTERP_BUILD_OPTIONS: "-DWAMR_BUILD_AOT=0 -DWAMR_BUILD_FAST_INTERP=1 -DWAMR_BUILD_INTERP=1 -DWAMR_BUILD_JIT=0 -DWAMR_BUILD_LAZY_JIT=0 -DWAMR_BUILD_SIMD=0"
  FAST_JIT_BUILD_OPTIONS: "-DWAMR_BUILD_AOT=1 -DWAMR_BUILD_FAST_INTERP=0 -DWAMR_BUILD_INTERP=1 -DWAMR_BUILD_FAST_JIT=1 -DWAMR_BUILD_JIT=0 -DWAMR_BUILD_LAZY_JIT=1"
  LLVM_LAZY_JIT_BUILD_OPTIONS: "-DWAMR_BUILD_AOT=1 -DWAMR_BUILD_FAST_INTERP=0 -DWAMR_BUILD_INTERP=0 -DWAMR_BUILD_JIT=1 -DWAMR_BUILD_LAZY_JIT=1"
  LLVM_EAGER_JIT_BUILD_OPTIONS: "-DWAMR_BUILD_AOT=1 -DWAMR_BUILD_FAST_INTERP=0 -DWAMR_BUILD_INTERP=0 -DWAMR_BUILD_JIT=1 -DWAMR_BUILD_LAZY_JIT=0"
  # For Spec Test
  DEFAULT_TEST_OPTIONS: "-s spec -x -p -b"
  SIMD_TEST_OPTIONS: "-s spec -x -p -b -S"
  XIP_TEST_OPTIONS: "-s spec -x -p -b -X"

permissions:
  contents: read

jobs:
  # Gate upstream minutes: always runs (a few-second no-op) and outputs `run`,
  # "true" only for a fork push or a PR's first approval. It must NOT be
  # skipped: a skipped job propagates the skip down the needs chain to every
  # descendant, even ones that broke the chain with their own `if`.
  gate:
    name: approval gate
    permissions:
      # `actions: read`: the gate dedups per head SHA by listing this
      # workflow's own runs.
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gate.yml
    with:
      paths: |
        .github/actions/**
        .github/scripts/**
        .github/workflows/build_llvm_libraries.yml
        .github/workflows/compilation_on_sgx.yml
        .github/workflows/gate.yml
        build-scripts/**
        core/**
        !core/deps/**
        product-mini/platforms/common/**
        product-mini/platforms/linux-sgx/**
        samples/**
        !samples/workload/**
        tests/wamr-test-suites/**
        wamr-compiler/**
  build_llvm_libraries:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/build_llvm_libraries.yml
    with:
      os: ubuntu-22.04
      arch: "X86"
      pr_ref: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

  build_iwasm:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        make_options_run_mode: [
            # Running modes supported
            $AOT_BUILD_OPTIONS,
            $CLASSIC_INTERP_BUILD_OPTIONS,
            $FAST_INTERP_BUILD_OPTIONS,
            $FAST_JIT_BUILD_OPTIONS,
            # Running modes unsupported
            #$LLVM_LAZY_JIT_BUILD_OPTIONS,
            #$LLVM_EAGER_JIT_BUILD_OPTIONS,
          ]
        make_options_feature: [
            # Features
            "-DWAMR_BUILD_CUSTOM_NAME_SECTION=1",
            # doesn't support
            # "-DWAMR_BUILD_DEBUG_AOT=1",
            # "-DWAMR_BUILD_DEBUG_INTERP=1",
            "-DWAMR_BUILD_DUMP_CALL_STACK=1",
            "-DWAMR_BUILD_LIB_PTHREAD=1",
            "-DWAMR_BUILD_LIB_WASI_THREADS=1",
            "-DWAMR_BUILD_LOAD_CUSTOM_SECTION=1",
            "-DWAMR_BUILD_MINI_LOADER=1",
            "-DWAMR_BUILD_MEMORY_PROFILING=1",
            "-DWAMR_BUILD_MULTI_MODULE=1",
            "-DWAMR_BUILD_PERF_PROFILING=1",
            "-DWAMR_BUILD_REF_TYPES=1",
            "-DWAMR_BUILD_EXTENDED_CONST_EXPR=1",
            # doesn't support
            "-DWAMR_BUILD_SIMD=0",
            "-DWAMR_BUILD_TAIL_CALL=1",
            "-DWAMR_DISABLE_HW_BOUND_CHECK=1",
            "-DWAMR_BUILD_SGX_IPFS=1",
          ]
        os: [ubuntu-22.04]
        platform: [linux-sgx]
        exclude:
          # incompatible mode and feature
          # MINI_LOADER only on INTERP mode
          - make_options_run_mode: $AOT_BUILD_OPTIONS
            make_options_feature: "-DWAMR_BUILD_MINI_LOADER=1"
          # FAST_JIT doesn't support MULTI_MODULE
          - make_options_run_mode: $FAST_JIT_BUILD_OPTIONS
            make_options_feature: "-DWAMR_BUILD_MULTI_MODULE=1"
        include:
          # classic interp mode doesn't support SIMD
          - make_options_run_mode: $CLASSIC_INTERP_BUILD_OPTIONS
            make_options_feature: "-DWAMR_BUILD_SIMD=0"
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      - name: install SGX SDK and necessary libraries
        uses: ./.github/actions/install-linux-sgx
        with:
          os: ${{ matrix.os }}

      - name: Build iwasm
        run: |
          mkdir build && cd build
          cmake .. ${{ matrix.make_options_run_mode }} ${{ matrix.make_options_feature }}
          cmake --build . --config Release --parallel 4
          cd ../enclave-sample
          make
        working-directory: product-mini/platforms/${{ matrix.platform }}

  run_samples_file:
    name: sample · file
    needs: [build_iwasm, build_llvm_libraries]
    uses: ./.github/workflows/samples_test.yml
    with:
      os: ubuntu-22.04
      samples: file
      llvm-cache-key: ${{ needs.build_llvm_libraries.outputs.cache_key }}
      # `env` is not available in a job-level `with:`; inline PR_REF here.
      ref: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

  spec_test_default:
    needs: [build_llvm_libraries]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        #(workaround) disable "fast-interp" because of SIMDE
        running_mode: ["classic-interp", "aot", "fast-jit"]
        test_option:
          [$DEFAULT_TEST_OPTIONS, $SIMD_TEST_OPTIONS, $XIP_TEST_OPTIONS]
        os: [ubuntu-22.04]
        exclude:
          # classic-interp, fast-interp and fast-jit don't support simd
          - running_mode: "classic-interp"
            test_option: $SIMD_TEST_OPTIONS
          - running_mode: "fast-interp"
            test_option: $SIMD_TEST_OPTIONS
          - running_mode: "fast-jit"
            test_option: $SIMD_TEST_OPTIONS
          # classic-interp, fast-interp and fast jit don't support XIP
          - running_mode: "classic-interp"
            test_option: $XIP_TEST_OPTIONS
          - running_mode: "fast-interp"
            test_option: $XIP_TEST_OPTIONS
          - running_mode: "fast-jit"
            test_option: $XIP_TEST_OPTIONS
        include:
          - os: ubuntu-22.04
            llvm_cache_key: ${{ needs.build_llvm_libraries.outputs.cache_key }}

    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}

      - name: Get LLVM libraries
        if: matrix.running_mode == 'aot'
        id: retrieve_llvm_libs
        uses: actions/cache@v6
        with:
          path: |
            ./core/deps/llvm/build/bin
            ./core/deps/llvm/build/include
            ./core/deps/llvm/build/lib
            ./core/deps/llvm/build/libexec
            ./core/deps/llvm/build/share
          key: ${{ matrix.llvm_cache_key }}

      - name: Quit if cache miss
        if: matrix.running_mode == 'aot' && steps.retrieve_llvm_libs.outputs.cache-hit != 'true'
        run: echo "::error::can not get prebuilt llvm libraries" && exit 1

      - name: install SGX SDK and necessary libraries
        uses: ./.github/actions/install-linux-sgx
        with:
          os: ${{ matrix.os }}

      #workaround about a https://github.com/actions/runner-images/issues/6680#issuecomment-2640923706
      - name: Increase swapfile
        run: |
          sudo swapoff -a
          sudo fallocate -l 15G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show

      - name: run spec tests
        run: |
          source /opt/intel/sgxsdk/environment
          ./test_wamr.sh ${{ matrix.test_option }} -t ${{ matrix.running_mode }}
        working-directory: ./tests/wamr-test-suites

  # Single stable check for branch protection. Set THIS as the required status
  # check, never an individual job: matrix job names are built from the matrix
  # dimensions, so every matrix refactor renames all of them and silently
  # invalidates whatever was configured under Settings -> Branches.
  #
  # `if: always()` is mandatory. Without it this job is skipped whenever an
  # upstream job fails, and a skipped job counts as passing for a required
  # check - it would be a gate that is green forever.
  #
  # `skipped` must count as success: when the gate resolves to run=false, every
  # job below is skipped, and that is the normal path.
  required:
    name: >-
      ${{ needs.gate.outputs.state == 'push' && 'sgx CI on push'
      || needs.gate.outputs.state == 'awaiting' && 'sgx CI awaiting approval'
      || needs.gate.outputs.state == 'approved' && 'sgx CI approved'
      || 'sgx CI' }}
    # `always()` keeps this aggregation check running even when upstream jobs
    # fail or are skipped, so GitHub evaluates the dynamic check name and the
    # script below can decide whether the workflow should pass.
    if: always()
    needs: [gate, build_llvm_libraries, build_iwasm, run_samples_file, spec_test_default]
    runs-on: ubuntu-22.04
    steps:
      - name: Report which dependency failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed_jobs=$(echo "$NEEDS" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' \
            | paste -sd ', ' -)
          if [ -n "$failed_jobs" ]; then
            echo "::error title=sgx CI::failed or cancelled dependency jobs: $failed_jobs"
          fi
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            > /dev/null
