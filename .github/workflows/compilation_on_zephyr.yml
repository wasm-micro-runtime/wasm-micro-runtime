name: compilation on zephyr

on:
  # Fork CI: runs on the fork's own Actions minutes when a contributor
  # pushes a branch to their fork.
  push:
    # Upstream pushes never reach the jobs anyway (the gate job returns
    # run=false unless the repository is a fork), so this filter only trims a
    # fork's mirrored copies of the maintainer branches - re-pushing main,
    # release/** or dev/** to a fork is a sync, not work worth building.
    # NOTE: do not name a fork feature branch main, release/*, or dev/* -
    # its push CI would be silently skipped by this filter.
    branches-ignore:
      - "main"
      - "release/**"
      - "dev/**"
    # This list is also what the approval gate re-applies on
    # pull_request_review (see gate.yml). Because `required` below treats a
    # skipped job as success, anything missing here makes `zephyr CI` go green
    # without building - so every input this workflow's result depends on must
    # be listed, including the reusable workflows and composite actions it
    # calls and the gate machinery that decides whether it runs at all.
    paths:
      - ".github/scripts/**"
      - ".github/workflows/compilation_on_zephyr.yml"
      - ".github/workflows/gate.yml"
      - "build-scripts/**"
      - "core/**"
      - "!core/deps/**"
      - "product-mini/platforms/common/**"
      - "product-mini/platforms/zephyr/**"
      - "samples/**"
      - "!samples/workload/**"
      - "tests/wamr-test-suites/**"
      - "wamr-compiler/**"
  # Upstream CI: only spend upstream minutes once a PR is approved
  # (first approval only, enforced by the gate job below).
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
  # allow to be triggered manually
  workflow_dispatch:

# Cancel any in-flight jobs for the same PR/branch so there's only one active
# at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Merge ref to check out on approval-gated review events; empty elsewhere
  # so checkout falls back to the event's default ref.
  PR_REF: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
  # FOR SETUP
  ZEPHYR_SDK_VERSION: "0.16.9"
  ZEPHYR_VERSION: "v3.7.0"
  ZEPHYR_TOOLCHAINS: "arc-zephyr-elf:arc64-zephyr-elf:x86_64-zephyr-elf"
  # FOR BUILD

permissions:
  contents: read

jobs:
  # Gate upstream minutes: always runs (a few-second no-op) and outputs `run`,
  # "true" only for a fork push or a PR's first approval. It must NOT be
  # skipped: a skipped job propagates the skip down the needs chain to every
  # descendant, even ones that broke the chain with their own `if`.
  gate:
    name: approval gate
    permissions:
      # `actions: read`: the gate dedups per head SHA by listing this
      # workflow's own runs.
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gate.yml
  smoke_test:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # One entry per (sample, simulator) pair. Which scenarios exist for a
        # sample, and on which platforms they may run, is declared in the
        # sample's sample.yaml; twister decides pass/fail.
        include:
          - name: simple (native_sim)
            sample: simple
            sim: native_sim
          - name: simple (ARC)
            sample: simple
            sim: qemu_arc
          - name: simple-file (native_sim)
            sample: simple-file
            sim: native_sim
          - name: simple-http (native_sim, build only)
            sample: simple-http
            sim: native_sim
          - name: user-mode (ARC)
            sample: user-mode
            sim: qemu_arc
    name: ${{ matrix.name }}
    container:
      # For Zephyr 3.7 LTS, use the v0.26-branch or the latest v0.26.x release Docker image.
      # ci require a larger runner to avoid "no space left on device"
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.26-branch
      options: --user root

    steps:
      # https://docs.zephyrproject.org/latest/develop/application/index.html#zephyr-workspace-application
      # zephyrproject/       --> CI ROOT
      # ├─── .west/
      # │    └─── config
      # ├─── bootloader/
      # ├─── zephyr/         --> Zephyr source code
      # ├─── zephyr-sdk/
      # ├─── modules/
      # │    |─── wasm-micro-runtime   --> WAMR source code
      # ├─── tools/
      # ├─── vendor/
      # └─── application/    --> DUMMY. keep west_lite.yml here

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}
          path: modules/wasm-micro-runtime

      - name: Prepare Zephyr environment
        shell: bash
        run: |
          mkdir -p application
          cp modules/wasm-micro-runtime/product-mini/platforms/zephyr/west_lite.yml application/west_lite.yml

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: application
          manifest-file-name: west_lite.yml
          sdk-version: ${{ env.ZEPHYR_SDK_VERSION }}
          # keep in sync with the setup.sh call in
          # product-mini/platforms/zephyr/Dockerfile
          toolchains: ${{ env.ZEPHYR_TOOLCHAINS }}

      - name: Build and run
        shell: bash
        # The same command reproduces this job locally with the Docker image,
        # without --no-docker. twister reports the verdict.
        run: |
          python3 product-mini/platforms/zephyr/build_and_run.py \
            --no-docker --sim ${{ matrix.sim }} ${{ matrix.sample }}
        working-directory: modules/wasm-micro-runtime

      - name: Summarize twister results
        if: always()
        shell: bash
        # The job already fails when twister does, since build_and_run.py
        # forwards its exit status. This turns the twister report into a
        # readable per-scenario summary in the job page.
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json

          report = glob.glob(
              "product-mini/platforms/zephyr/build/twister-*/twister.json")
          if not report:
              print("no twister report was produced")
              raise SystemExit(0)

          print("| Scenario | Platform | Status |")
          print("| --- | --- | --- |")
          for path in report:
              with open(path) as f:
                  data = json.load(f)
              for item in data.get("testsuites", []):
                  print("| {} | {} | {} |".format(
                      item.get("name"), item.get("platform"),
                      item.get("status", "unknown")))
          EOF
        working-directory: modules/wasm-micro-runtime

  # Single stable check for branch protection. Set THIS as the required status
  # check, never an individual job: matrix job names are built from the matrix
  # dimensions, so every matrix refactor renames all of them and silently
  # invalidates whatever was configured under Settings -> Branches.
  #
  # `if: always()` is mandatory. Without it this job is skipped whenever an
  # upstream job fails, and a skipped job counts as passing for a required
  # check - it would be a gate that is green forever.
  #
  # `skipped` must count as success: when the gate resolves to run=false (the
  # PR does not touch this workflow's paths, or it is not the first approval)
  # every job below is skipped, and that is the normal path.
  required:
    # Same as the `required` job in compilation_on_ubuntu.yml: keep the
    # canonical required-check name only when gate.run=true.
    name: zephyr CI${{ needs.gate.outputs.run != 'true' && ' (non-required)' || '' }}
    # `always()` is mandatory: on approval-triggered runs this job must run
    # and fail when any dependency failed (a skipped job counts as passing for
    # a required check). Only an upstream push is exempt - the gate already
    # resolved to run=false there, every dependency is skipped, and skipping
    # this job too keeps the whole push run uniformly "did not run".
    if: always() && !(github.event_name == 'push' && github.event.repository.fork == false)
    needs: [gate, smoke_test]
    runs-on: ubuntu-22.04
    steps:
      - name: Report which dependency failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed_jobs=$(echo "$NEEDS" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' \
            | paste -sd ', ' -)
          if [ -n "$failed_jobs" ]; then
            echo "::error title=zephyr CI::failed or cancelled dependency jobs: $failed_jobs"
          fi
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            > /dev/null
