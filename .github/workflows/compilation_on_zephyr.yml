name: compilation on zephyr

on:
  # Fork CI: runs on the fork's own Actions minutes when a contributor
  # pushes a branch to their fork.
  push:
    # Upstream pushes never reach the jobs anyway (the gate job returns
    # run=false unless the repository is a fork), so this filter only trims a
    # fork's mirrored copies of the maintainer branches - re-pushing main,
    # release/** or dev/** to a fork is a sync, not work worth building.
    # NOTE: do not name a fork feature branch main, release/*, or dev/* -
    # its push CI would be silently skipped by this filter.
    branches-ignore:
      - "main"
      - "release/**"
      - "dev/**"
  # Upstream CI: only spend upstream minutes once a PR is approved
  # (first approval only, enforced by the gate job below).
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
  # allow to be triggered manually
  workflow_dispatch:

# Cancel any in-flight jobs for the same PR/branch so there's only one active
# at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Merge ref to check out on approval-gated review events; empty elsewhere
  # so checkout falls back to the event's default ref.
  PR_REF: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
  # FOR SETUP
  ZEPHYR_SDK_VERSION: "0.16.9"
  ZEPHYR_VERSION: "v3.7.0"
  ZEPHYR_TOOLCHAINS: "arc-zephyr-elf:arc64-zephyr-elf:x86_64-zephyr-elf"
  # FOR BUILD

permissions:
  contents: read

jobs:
  # Gate upstream minutes: always runs (a few-second no-op) and outputs `run`,
  # "true" only for a fork push or a PR's first approval. It must NOT be
  # skipped: a skipped job propagates the skip down the needs chain to every
  # descendant, even ones that broke the chain with their own `if`.
  gate:
    name: approval gate
    permissions:
      # `actions: read`: the gate dedups per head SHA by listing this
      # workflow's own runs.
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gate.yml
    with:
      paths: |
        .github/scripts/**
        .github/workflows/compilation_on_zephyr.yml
        .github/workflows/gate.yml
        build-scripts/**
        core/**
        !core/deps/**
        product-mini/platforms/common/**
        product-mini/platforms/zephyr/**
        samples/**
        !samples/workload/**
        tests/wamr-test-suites/**
        wamr-compiler/**
  # One job, not a matrix: twister is handed every sample and every Ztest
  # suite at once and already knows which may run where, from the
  # platform_allow of each sample.yaml or testcase.yaml, and filters the rest
  # out. The per-scenario breakdown a matrix would have given is in the job
  # summary below.
  smoke_test:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-22.04
    name: smoke test
    container:
      # For Zephyr 3.7 LTS, use the v0.26-branch or the latest v0.26.x release Docker image.
      # ci require a larger runner to avoid "no space left on device"
      image: ghcr.io/zephyrproject-rtos/ci-base:v0.26-branch
      options: --user root

    steps:
      # https://docs.zephyrproject.org/latest/develop/application/index.html#zephyr-workspace-application
      # zephyrproject/       --> CI ROOT
      # ├─── .west/
      # │    └─── config
      # ├─── bootloader/
      # ├─── zephyr/         --> Zephyr source code
      # ├─── zephyr-sdk/
      # ├─── modules/
      # │    |─── wasm-micro-runtime   --> WAMR source code, this PR
      # ├─── tools/
      # ├─── vendor/
      # └─── application/    --> a copy of product-mini/platforms/zephyr:
      #                          west.yml plus the applications
      #
      # This is the layout a user of west.yml gets, with one difference: WAMR
      # is marked inactive below, so `west update` leaves the checkout above
      # alone and the runtime under test is the one from this PR rather than a
      # fresh clone of main.

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}
          path: modules/wasm-micro-runtime

      - name: Install wasi-sdk and wabt
        uses: ./modules/wasm-micro-runtime/.github/actions/install-wasi-sdk-wabt
        with:
          os: ubuntu-22.04

      - name: Prepare Zephyr environment
        shell: bash
        # The manifest repository is the whole application directory, copied
        # out of the checkout - the same thing a user would copy.
        #
        # west.yml lists WAMR; marking the project inactive is what keeps the
        # `west update` in the next step from cloning it over the checkout.
        # Written to the config file rather than run through `west config`,
        # because west is only installed by that step.
        run: |
          cp -r modules/wasm-micro-runtime/product-mini/platforms/zephyr application
          printf '[manifest]\nproject-filter = -wasm-micro-runtime\n' >> ~/.westconfig

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: application
          manifest-file-name: west.yml
          sdk-version: ${{ env.ZEPHYR_SDK_VERSION }}
          # keep in sync with the setup.sh call in
          # product-mini/platforms/zephyr/Dockerfile
          toolchains: ${{ env.ZEPHYR_TOOLCHAINS }}
          # The action keys ccache on a run-time timestamp, so every run stores
          # a fresh ~400 MB copy no other run can restore. The SDK cache above
          # has a content-derived key and is kept; ci_cache_warmup.yml warms it
          # on the default branch.
          enable-ccache: false

      - name: Build and run native simulator with coverage
        shell: bash
        run: |
          python3 product-mini/platforms/zephyr/build_and_run.py \
            --no-docker --coverage --sim native_sim
        working-directory: modules/wasm-micro-runtime

      - name: Build and run QEMU ARC
        shell: bash
        run: |
          python3 product-mini/platforms/zephyr/build_and_run.py \
            --no-docker --sim qemu_arc
        working-directory: modules/wasm-micro-runtime

      - name: Summarize twister results
        if: always()
        shell: bash
        # The job already fails when twister does, since build_and_run.py
        # forwards its exit status. This turns the twister report into a
        # readable per-scenario summary in the job page.
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, json

          report = glob.glob(
              "product-mini/platforms/zephyr/build/twister-*/twister.json")
          if not report:
              print("no twister report was produced")
              raise SystemExit(0)

          print("| Scenario | Platform | Status |")
          print("| --- | --- | --- |")
          for path in report:
              with open(path) as f:
                  data = json.load(f)
              for item in data.get("testsuites", []):
                  print("| {} | {} | {} |".format(
                      item.get("name"), item.get("platform"),
                      item.get("status", "unknown")))

          coverage_path = (
              "product-mini/platforms/zephyr/build/"
              "twister-all-native_sim-coverage/coverage.json")
          print("\n### Native simulator coverage\n")
          print("| Scope | Lines | Branches |")
          print("| --- | ---: | ---: |")
          try:
              with open(coverage_path) as f:
                  coverage = json.load(f)
          except (OSError, ValueError):
              print("| `core/shared/platform/zephyr` | unavailable | unavailable |")
          else:
              prefix = "core/shared/platform/zephyr/"
              files = [
                  item for item in coverage.get("files", [])
                  if prefix in item.get("file", "").replace("\\", "/")
              ]
              lines = [line for item in files for line in item.get("lines", [])]
              branches = [
                  branch for line in lines
                  for branch in line.get("branches", [])
              ]

              def metric(items):
                  total = len(items)
                  covered = sum(item.get("count", 0) > 0 for item in items)
                  percent = 100.0 * covered / total if total else 0.0
                  return f"{covered}/{total} ({percent:.1f}%)"

              print("| `core/shared/platform/zephyr` | {} | {} |".format(
                  metric(lines), metric(branches)))
          EOF
        working-directory: modules/wasm-micro-runtime

      - name: Upload native simulator coverage
        if: ${{ always() && github.event.repository.fork == true }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zephyr-wamr-smoke-coverage-native-sim
          path: |
            modules/wasm-micro-runtime/product-mini/platforms/zephyr/build/twister-all-native_sim-coverage/coverage/
            modules/wasm-micro-runtime/product-mini/platforms/zephyr/build/twister-all-native_sim-coverage/coverage.json
          if-no-files-found: warn

  # Single stable check for branch protection. Set THIS as the required status
  # check, never an individual job: matrix job names are built from the matrix
  # dimensions, so every matrix refactor renames all of them and silently
  # invalidates whatever was configured under Settings -> Branches.
  #
  # `if: always()` is mandatory. Without it this job is skipped whenever an
  # upstream job fails, and a skipped job counts as passing for a required
  # check - it would be a gate that is green forever.
  #
  # `skipped` must count as success: when the gate resolves to run=false, every
  # job below is skipped, and that is the normal path.
  required:
    name: >-
      ${{ needs.gate.outputs.state == 'push' && 'zephyr CI on push'
      || needs.gate.outputs.state == 'awaiting' && 'zephyr CI awaiting approval'
      || needs.gate.outputs.state == 'approved' && 'zephyr CI approved'
      || 'zephyr CI' }}
    # `always()` keeps this aggregation check running even when upstream jobs
    # fail or are skipped, so GitHub evaluates the dynamic check name and the
    # script below can decide whether the workflow should pass.
    if: always()
    needs: [gate, smoke_test]
    runs-on: ubuntu-22.04
    steps:
      - name: Report which dependency failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed_jobs=$(echo "$NEEDS" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' \
            | paste -sd ', ' -)
          if [ -n "$failed_jobs" ]; then
            echo "::error title=zephyr CI::failed or cancelled dependency jobs: $failed_jobs"
          fi
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            > /dev/null
