name: "CodeQL"

on:
  # Fork CI: runs on the fork's own Actions minutes when a contributor
  # pushes a branch to their fork.
  push:
    # Upstream pushes never reach the jobs anyway (the gate job returns
    # run=false unless the repository is a fork), so this filter only trims a
    # fork's mirrored copies of the maintainer branches - re-pushing main,
    # release/** or dev/** to a fork is a sync, not work worth building.
    # NOTE: do not name a fork feature branch main, release/*, or dev/* -
    # its push CI would be silently skipped by this filter.
    branches-ignore:
      - "main"
      - "release/**"
      - "dev/**"
  # Upstream CI: on the first approval, re-run once - but only when the PR
  # changed the CodeQL pipeline itself (gate.paths below). Regular source
  # changes are covered by the nightly cron, not per-PR.
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
  # midnight UTC on the latest commit on the main branch
  schedule:
    - cron: "0 0 * * *"
  # allow to be triggered manually
  workflow_dispatch:

# Serialize CodeQL runs per PR / branch. Only an approval-gated review cancels
# its superseded run; feature-branch pushes and the nightly cron are left to
# finish, so branch and scheduled scans are never dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_review' || github.event_name == 'pull_request' }}

env:
  # Merge ref to check out on approval-gated review events; empty elsewhere
  # so checkout falls back to the event's default ref.
  PR_REF: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}

jobs:
  # Gate the upstream approval re-run: only for a PR's first approval AND only
  # when the PR touches the CodeQL pipeline definition (not general source).
  gate:
    permissions:
      # `actions: read`: the gate dedups per head SHA by listing this
      # workflow's own runs.
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gate.yml
    with:
      paths: |
        .github/workflows/codeql.yml
        .github/workflows/gate.yml
        .github/scripts/codeql_buildscript.sh
        .github/scripts/codeql_fail_on_error.py
        .github/codeql/**

  analyze:
    # Where each trigger is meant to run:
    #   - push:     fork CI only (a contributor's fork), on the fork's minutes.
    #   - schedule: upstream only (the nightly scan of the canonical repo).
    #   - review:   upstream, first approval, only if the pipeline changed.
    #   - dispatch: anywhere, for manual runs on either repo.
    # The gate decides push / review / dispatch; only the schedule case, which
    # must stay upstream-only, is spelled out here.
    needs: gate
    if: >-
      !cancelled() &&
      (
        github.event_name == 'schedule'
          && github.repository == 'wasm-micro-runtime/wasm-micro-runtime'
        || github.event_name != 'schedule'
          && needs.gate.outputs.run == 'true'
      )
    name: Analyze
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners
    # Consider using larger runners for possible analysis time improvements.
    # But it is not free, so please be aware of the cost.
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        #TODO: add actions
        language: ["cpp"]

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PR_REF }}
          submodules: recursive

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: ${{ matrix.language }}
          # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
          # queries: security-extended,security-and-quality
          queries: security-and-quality
          config-file: ./.github/codeql/codeql_config.yml

      - run: |
          ./.github/scripts/codeql_buildscript.sh || exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.6
        with:
          category: "/language:${{matrix.language}}"
          upload: false
        id: step1

      # - cpp/alloca-in-loop is about touch_pages() which is intended to
      # - cpp/command-line-injection is about bh_system() which is used to
      # - cpp/path-injection is used in bh_read_file_to_buffer() to load a .wasm.
      #   or operate a stack usage file which is not sensitive or generate a .aot
      # - cpp/suspicious-pointer-scaling
      #   - wasm_runtime_invoke_native() used to trivial registers
      # - cpp/uncontrolled-process-operation is about dlopen() which is used by
      #   native libraries registrations.
      # - cpp/world-writable-file-creation is about fopen() a temporary file
      #   for perf-PID.map or .aot(wamrc). The permission isn't sensitive.
      #   file.
      #
      # execute customized compiler
      - name: Filter out unwanted errors and warnings
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            ## Exclude files and directories
            -**/build/**
            -**/core/deps/**
            -**/cmake*/Modules/**
            -**/test*/**
            -**/wasm-app*/**
            ## Exclude rules 1. Related to formatting, style
            -**:cpp/commented-out-code
            -**:cpp/complex-condition
            -**:cpp/empty-if
            -**:cpp/fixme-comment
            -**:cpp/include-non-header
            -**:cpp/long-switch
            -**:cpp/poorly-documented-function
            -**:cpp/trivial-switch
            -**:cpp/unused-local-variable
            -**:cpp/unused-static-function
            -**:cpp/unused-static-variable
            -**:cpp/use-of-goto
            ## Exclude rules 2. Related to special usage of APIs
            -**:cpp/alloca-in-loop
            -**:cpp/command-line-injection
            -**:cpp/path-injection
            -core/iwasm/common/wasm_runtime_common.c:cpp/suspicious-pointer-scaling
            -**:cpp/uncontrolled-process-operation
            -**:cpp/world-writable-file-creation
          input: ${{ steps.step1.outputs.sarif-output }}/cpp.sarif
          output: ${{ steps.step1.outputs.sarif-output }}/cpp.sarif

      - name: Upload CodeQL results to code scanning
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: ${{ steps.step1.outputs.sarif-output }}
          category: "/language:${{matrix.language}}"

      - name: Upload CodeQL results as an artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: codeql-results
          path: ${{ steps.step1.outputs.sarif-output }}
          retention-days: 10

      - name: Fail if an error is found
        run: |
          ./.github/scripts/codeql_fail_on_error.py \
            ${{ steps.step1.outputs.sarif-output }}/cpp.sarif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
