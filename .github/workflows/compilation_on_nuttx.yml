name: compilation on nuttx

on:
  # Fork CI: runs on the fork's own Actions minutes when a contributor
  # pushes a branch to their fork.
  push:
    # Upstream pushes never reach the jobs anyway (the gate job returns
    # run=false unless the repository is a fork), so this filter only trims a
    # fork's mirrored copies of the maintainer branches - re-pushing main,
    # release/** or dev/** to a fork is a sync, not work worth building.
    # NOTE: do not name a fork feature branch main, release/*, or dev/* -
    # its push CI would be silently skipped by this filter.
    branches-ignore:
      - "main"
      - "release/**"
      - "dev/**"
  # Upstream CI: only spend upstream minutes once a PR is approved
  # (first approval only, enforced by the gate job below).
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
  # allow to be triggered manually
  workflow_dispatch:

# Cancel any in-flight jobs for the same PR/branch so there's only one active
# at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Merge ref to check out on approval-gated review events; empty elsewhere
  # so checkout falls back to the event's default ref.
  PR_REF: ${{ (github.event_name == 'pull_request_review' || github.event_name == 'pull_request') && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
  WASI_SDK_PATH: "/opt/wasi-sdk"
  NUTTX_IMAGE: "ghcr.io/apache/nuttx/apache-nuttx-ci-linux@sha256:d9261eacf6c6ebe656c571757751c803e8f04c3ae9b820320a5ea5dd57b7205a"
  # Bump BLOATY_REF to update bloaty. The size-report cache below is keyed on
  # it, so a new ref rebuilds bloaty and refreshes the cache automatically.
  BLOATY_REF: "34f4a66559ad4938c1e629e9b5f54630b2b4d7b0"

permissions:
  contents: read

jobs:
  # Gate upstream minutes: always runs (a few-second no-op) and outputs `run`,
  # "true" only for a fork push or a PR's first approval. It must NOT be
  # skipped: a skipped job propagates the skip down the needs chain to every
  # descendant, even ones that broke the chain with their own `if`.
  gate:
    name: approval gate
    permissions:
      # `actions: read`: the gate dedups per head SHA by listing this
      # workflow's own runs.
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gate.yml
    with:
      paths: |
        .github/scripts/**
        .github/workflows/compilation_on_nuttx.yml
        .github/workflows/gate.yml
        build-scripts/**
        core/**
        !core/deps/**
        product-mini/platforms/common/**
        product-mini/platforms/nuttx/**
        samples/**
        !samples/workload/**
        tests/wamr-test-suites/**
        wamr-compiler/**

  # Build bloaty once and cache it, keyed on BLOATY_REF (a new ref -> cache
  # miss -> rebuild + refresh). The matrix below restores the prebuilt binary
  # instead of every leg compiling bloaty and its protobuf/abseil submodules.
  build_bloaty:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore or seed the bloaty cache
        id: cache
        uses: actions/cache@v6
        with:
          path: bloaty-bin
          key: bloaty-${{ env.BLOATY_REF }}-ubuntu-latest

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af || true

      - name: Checkout Bloaty
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: google/bloaty
          submodules: recursive
          path: bloaty
          ref: ${{ env.BLOATY_REF }}

      - name: Build bloaty (inside the NuttX CI image)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            "${NUTTX_IMAGE}" bash -exc 'cmake -Bbuild -GNinja bloaty && cmake --build build'
          mkdir -p bloaty-bin
          cp build/bloaty bloaty-bin/bloaty

  build_iwasm_on_nuttx:
    needs: build_bloaty
    runs-on: ubuntu-latest
    # The build runs inside the apache NuttX CI image, but this is deliberately
    # NOT a `container:` job. A container job pulls the (large) image at job
    # init, before any step runs, and the runner's default free space is not
    # enough for the image plus the build -> "no space left on device". Instead
    # we free the unused preinstalled toolchains first, then run the build with
    # `docker run`.
    strategy:
      matrix:
        nuttx_board_config: [
          # x64
          "boards/sim/sim/sim/configs/nsh",
          # cortex-m0
          "boards/arm/rp2040/raspberrypi-pico/configs/nsh",
          # cortex-m7
          "boards/arm/stm32h7/nucleo-h743zi/configs/nsh",
          # cortex-m33
          "boards/arm/rp23xx/raspberrypi-pico-2/configs/nsh",
          # riscv32gc
          "boards/risc-v/qemu-rv/rv-virt/configs/nsh",
          # riscv64gc
          "boards/risc-v/qemu-rv/rv-virt/configs/nsh64",
          # arm64
          "boards/arm64/qemu/qemu-armv8a/configs/nsh",
        ]

        wamr_config_option:
          - "CONFIG_INTERPRETERS_WAMR_AOT"
          - "CONFIG_INTERPRETERS_WAMR_FAST"
          - "CONFIG_INTERPRETERS_WAMR_CLASSIC"
          - "CONFIG_INTERPRETERS_WAMR_AOT CONFIG_INTERPRETERS_WAMR_FAST"
          - "CONFIG_INTERPRETERS_WAMR_AOT CONFIG_INTERPRETERS_WAMR_FAST CONFIG_INTERPRETERS_WAMR_LIBC_WASI"
          - "CONFIG_INTERPRETERS_WAMR_AOT CONFIG_INTERPRETERS_WAMR_FAST CONFIG_INTERPRETERS_WAMR_LIBC_BUILTIN"
          - "CONFIG_INTERPRETERS_WAMR_AOT CONFIG_INTERPRETERS_WAMR_CLASSIC"
          - "CONFIG_INTERPRETERS_WAMR_AOT CONFIG_INTERPRETERS_WAMR_CLASSIC CONFIG_INTERPRETERS_WAMR_LIBC_WASI"

    steps:
      - name: Free disk space
        run: |
          # The apache NuttX CI image is large; reclaim the preinstalled
          # toolchains we don't use so the image + build fit on the runner.
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo docker image prune -af || true
          df -h /

      - name: Checkout NuttX
        uses: actions/checkout@v7.0.1
        with:
          repository: apache/nuttx
          ref: 09a71ec7c16c43398d5acbdcbeee7b08736c3170
          path: nuttx

      - name: Checkout NuttX Apps
        uses: actions/checkout@v7.0.1
        with:
          repository: apache/nuttx-apps
          ref: 6bd593459c4af3cef325c3d22bccd5537a8ed755
          path: apps

      - name: Checkout WAMR
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.PR_REF }}
          path: apps/interpreters/wamr/wamr

      - name: Restore prebuilt bloaty
        uses: actions/cache/restore@v6
        with:
          path: bloaty-bin
          key: bloaty-${{ env.BLOATY_REF }}-ubuntu-latest
          fail-on-cache-miss: true

      - name: Configure and build NuttX (inside the NuttX CI image)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work/nuttx \
            "${NUTTX_IMAGE}" bash -exc '
              tools/configure.sh ${{ matrix.nuttx_board_config }}
              kconfig-tweak --disable CONFIG_RP2040_UF2_BINARY
              kconfig-tweak --disable CONFIG_RP23XX_UF2_BINARY
              kconfig-tweak --enable CONFIG_PSEUDOFS_SOFTLINKS
              kconfig-tweak --enable CONFIG_INTERPRETERS_WAMR
              kconfig-tweak --enable CONFIG_INTERPRETERS_IWASM_TASK
              kconfig-tweak --set-val CONFIG_INTERPRETERS_WAMR_PRIORITY 100
              kconfig-tweak --set-val CONFIG_INTERPRETERS_WAMR_STACKSIZE 8192
              for x in ${{ matrix.wamr_config_option }}; do
                kconfig-tweak --enable $x
              done
              make -j$(nproc) EXTRAFLAGS=-Werror
            '

      - name: Size Report (bloaty, inside the NuttX CI image)
        run: |
          # Run the prebuilt bloaty (restored from the cache above) against the
          # NuttX ELF, inside the same image it was built in.
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            "${NUTTX_IMAGE}" bash -exc '
              echo "Build target: ${{ matrix.nuttx_board_config }}"
              echo "WAMR build config: ${{ matrix.wamr_config_option }}"
              echo "WAMR size:"
              bloaty-bin/bloaty -d compileunits --source-filter wamr nuttx/nuttx
              echo "libc-builtin size (if enabled):"
              bloaty-bin/bloaty -d compileunits --source-filter libc-builtin nuttx/nuttx
              echo "libc-wasi size (if enabled):"
              bloaty-bin/bloaty -d compileunits --source-filter libc-wasi nuttx/nuttx
            '

  # Single stable check for branch protection. Set THIS as the required status
  # check, never an individual job: matrix job names are built from the matrix
  # dimensions, so every matrix refactor renames all of them and silently
  # invalidates whatever was configured under Settings -> Branches.
  #
  # `if: always()` is mandatory. Without it this job is skipped whenever an
  # upstream job fails, and a skipped job counts as passing for a required
  # check - it would be a gate that is green forever.
  #
  # `skipped` must count as success: when the gate resolves to run=false (the
  # PR does not touch this workflow's paths, or it is not the first approval)
  # every job below is skipped, and that is the normal path.
  required:
    name: >-
      ${{ needs.gate.outputs.state == 'push' && 'nuttx CI on push'
      || needs.gate.outputs.state == 'awaiting' && 'nuttx CI awaiting approval'
      || needs.gate.outputs.state == 'approved' && 'nuttx CI approved'
      || 'nuttx CI' }}
    if: always() && needs.gate.outputs.run == 'true'
    needs: [gate, build_bloaty, build_iwasm_on_nuttx]
    runs-on: ubuntu-22.04
    steps:
      - name: Report which dependency failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          failed_jobs=$(echo "$NEEDS" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' \
            | paste -sd ', ' -)
          if [ -n "$failed_jobs" ]; then
            echo "::error title=nuttx CI::failed or cancelled dependency jobs: $failed_jobs"
          fi
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            > /dev/null
