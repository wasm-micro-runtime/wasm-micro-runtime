# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

# Check current WASM Micro Runtime results here: https://securityscorecards.dev/viewer/?uri=github.com/wasm-micro-runtime/wasm-micro-runtime

name: Scorecard supply-chain security
on:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  # midnight UTC
  schedule:
    - cron: "17 3 * * *"
  # allow to be triggered manually
  workflow_dispatch:

# Declare default permissions as read only.
permissions:
  contents: read

# Avoid overlapping runs (e.g. manual dispatch during a scheduled run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skip the daily cron when the default branch has not moved in the last 24h:
  # the score cannot change without new commits. Other events always run.
  scorecard_guard:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - name: Decide whether the scorecard should run
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every early exit (and the final fall-through) writes an
          # annotation so the guard decision is visible in the run UI.
          set_run() {
            local run="$1"
            local message="$2"
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "::notice title=scorecard guard::$message"
          }

          # Non-schedule events (workflow_dispatch, branch_protection_rule)
          # always run; only the daily cron is skippable.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            set_run true "running: ${{ github.event_name }} event is not the daily cron, guard does not apply"
            exit 0
          fi

          # Skip when the default branch has not moved in the last 24h. A failed
          # API/date lookup is treated as "assume activity" so a transient API
          # error can never silently skip the scan (fail open).
          last_commit_ts=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/${{ github.event.repository.default_branch }}" \
            --jq '.commit.committer.date' 2>/dev/null || true)
          last_ts=""
          if [ -n "$last_commit_ts" ]; then
            last_ts=$(date -u -d "$last_commit_ts" +%s 2>/dev/null || true)
          fi
          if [ -n "$last_ts" ] && [ "$last_ts" -lt "$(date -u -d '24 hours ago' +%s)" ]; then
            set_run false "skipping: no commits on the default branch in the last 24 hours"
            exit 0
          fi
          set_run true "running: scheduled scorecard"

  analysis:
    name: Scorecard analysis
    needs: scorecard_guard
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    # Skip forks: they cannot publish results or upload to code-scanning.
    if: ${{ !cancelled() && github.event.repository.fork == false && needs.scorecard_guard.outputs.run == 'true' }}
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and get a badge (see publish_results below).
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif

          #   - Publish results to OpenSSF REST API for easy access by consumers
          #   - Allows the repository to include the Scorecard badge.
          #   - See https://github.com/ossf/scorecard-action#publishing-results.
          publish_results: true

      # Upload the results to GitHub's code scanning dashboard.
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
